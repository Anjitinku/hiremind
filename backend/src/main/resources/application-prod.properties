# Production profile - used on Railway
server.port=${PORT:8080}

# PostgreSQL (Railway injects DATABASE_URL automatically)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Disable H2 in production
spring.h2.console.enabled=false

# JWT
jwt.secret=${JWT_SECRET:hiremind-super-secret-key-2024-very-long-string-for-security}
jwt.expiration=86400000

# CORS
app.cors.allowed-origins=${FRONTEND_URL:https://hiremind.vercel.app}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
